{% extends "base.html" %}

{% block title %}
My Profile
{% endblock %}


{% block content %}

<section class="dashboard">

    <div class="page-title">

        <span class="section-tag">
            DIGITAL PROFILE
        </span>

        <h1>
            My Profile
        </h1>

        <p>
            Manage your personal and business information.
        </p>

    </div>


    <div class="profile-layout">

        <div class="profile-summary">

            <div class="profile-avatar">
                {{ user["name"][0]|upper }}
            </div>

            <h2>
                {{ user["name"] }}
            </h2>

            <p>
                {{ user["role"]|upper }}
            </p>

            <p>
                {{ user["email"] }}
            </p>

        </div>


        <div class="form-area">

            <form method="POST">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    name="name"
                    value="{{ user['name'] }}"
                    required
                >


                <label>
                    Email
                </label>

                <input
                    type="email"
                    value="{{ user['email'] }}"
                    disabled
                >


                <label>
                    Mobile Number
                </label>

                <input
                    type="text"
                    name="phone"
                    value="{{ user['phone'] }}"
                    required
                >


                <label>
                    Business Name
                </label>

                <input
                    type="text"
                    name="business_name"
                    value="{{ user['business_name'] or '' }}"
                >


                <label>
                    Business Type
                </label>

                <input
                    type="text"
                    name="business_type"
                    value="{{ user['business_type'] or '' }}"
                >


                <label>
                    Address
                </label>

                <textarea
                    name="address"
                >{{ user['address'] or '' }}</textarea>


                <button
                    class="button"
                    type="submit"
                >
                    Save Profile
                </button>

            </form>

        </div>

    </div>

</section>

{% endblock %}
